name: Build release image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/spitzli/webdock-extension-project-notes:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/spitzli/webdock-extension-project-notes
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'ghcr.io/spitzli/webdock-extension-project-notes@%s\n' "$DIGEST" > image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: image.txt
